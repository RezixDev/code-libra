<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- React Logo with blue background -->
  <rect x="0" y="0" width="200" height="200" rx="10" fill="#38BDF8" />
  
  <!-- React atom symbol on white -->
  <g transform="translate(32, 32) scale(1.35)">
    <ellipse cx="50" cy="50" rx="50" ry="18" stroke="white" stroke-width="7" fill="none" />
    <ellipse cx="50" cy="50" rx="50" ry="18" stroke="white" stroke-width="7" fill="none" transform="rotate(60, 50, 50)" />
    <ellipse cx="50" cy="50" rx="50" ry="18" stroke="white" stroke-width="7" fill="none" transform="rotate(120, 50, 50)" />
    <circle cx="50" cy="50" r="10" fill="white" />
  </g>
</svg>